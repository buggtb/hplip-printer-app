name: BuildStream cache refill

on:
  push:
    branches: [testing]
    paths:
      - project.conf
      - elements/**
      - include/**
      - patches/**
      - files/**
      - Makefile
      - hplip-printer-app.c
      - hplip-plugin-verify.c
      - hplip-plugin-verify.h
      - hplip-download-policy.c
      - hplip-download-policy.h
      - hplip-printer-app.1
      - hplip-printer-app.service
      - testpage.ps
      - HP
      - scripts/hplip-plugin-state.sh
      - VERSION
      - ci/buildstream.conf
      - .github/workflows/bst-cache.yml
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refill:
    name: Refill (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    concurrency:
      group: bst-cache-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host requirements
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Compute BuildStream cache key
        id: bst-key
        env:
          ARCH: ${{ matrix.arch }}
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'hplip-printer-app.c', 'hplip-plugin-verify.c', 'hplip-plugin-verify.h', 'hplip-download-policy.c', 'hplip-download-policy.h', 'hplip-printer-app.1', 'hplip-printer-app.service', 'testpage.ps', 'HP', 'scripts/hplip-plugin-state.sh', 'VERSION') }}
        run: echo "prefix=bst-v1-${ARCH}-${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.bst-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.bst-key.outputs.prefix }}
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build image
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/hplip-printer-app.bst
      - name: Measure cache
        id: size
        run: |
          mb="$(du -sm --total ~/.cache/buildstream/cas ~/.cache/buildstream/artifacts ~/.cache/buildstream/source_protos 2>/dev/null | tail -1 | cut -f1)"
          echo "mb=${mb}" >> "$GITHUB_OUTPUT"
          echo "### BuildStream cache (${{ matrix.arch }}): ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          # Both arches must fit the 10 GB repo cache: save at most 9000 MB
          # uncompressed per arch (about 4.3 GB once actions/cache compresses it).
          if [ "${mb}" -le 9000 ]; then
            echo "fits=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::BuildStream cache is ${mb} MB (> 9000 MB); not saving"
            exit 1
          fi
      - name: Save BuildStream cache
        id: save
        if: steps.size.outputs.fits == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.bst-key.outputs.prefix }}${{ github.run_id }}
      - name: Prune older BuildStream caches
        if: steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH: ${{ matrix.arch }}
          KEEP: ${{ steps.bst-key.outputs.prefix }}${{ github.run_id }}
        run: |
          gh cache list --key "bst-v1-${ARCH}-" --ref "$GITHUB_REF" --limit 100 --json id,key \
            --jq '.[] | select(.key != env.KEEP) | .id' |
            while read -r id; do
              echo "Deleting cache ${id}"
              gh cache delete "$id"
            done
      - name: Report saved cache
        if: steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '### Saved BuildStream caches'
            gh cache list --ref "$GITHUB_REF" --key bst-v1- --json key,sizeInBytes \
              --jq '.[] | "- \(.key): \(.sizeInBytes / 1048576 | floor) MB"'
          } >> "$GITHUB_STEP_SUMMARY"
